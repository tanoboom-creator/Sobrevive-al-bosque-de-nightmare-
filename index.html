<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#050807"><link rel="icon" href="icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Escapa del Bosque de Nightmare</title>
<style>
:root{--red:#b3141b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#050807;color:#cfd8d0;font-family:Georgia,serif;overflow:hidden;touch-action:none;user-select:none}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:0;right:0;text-align:center;pointer-events:none;text-shadow:0 0 6px #000}#hud b{display:block;font-size:24px;color:#f0b040}#hud small{font-size:13px;opacity:.8}
#bn,#gn{position:absolute;right:-4px;top:-4px;min-width:26px;height:26px;border-radius:13px;background:#b3141b;color:#fff;font:bold 15px Georgia,serif;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:rgba(3,5,4,.88);padding:24px;gap:14px}
#ov h1{font-size:32px;margin:0;color:var(--red)}#ov p{max-width:330px;margin:0;line-height:1.45}
button{font:inherit;font-size:18px;padding:12px 28px;background:var(--red);color:#fff;border:0;border-radius:4px}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
#js{position:fixed;left:20px;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.3)}
#kn{position:absolute;left:41px;top:41px;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.35)}
#bf{position:fixed;right:24px;bottom:calc(env(safe-area-inset-bottom,0px) + 36px);width:78px;height:78px;border-radius:50%;background:rgba(255,120,30,.25);border:2px solid rgba(255,160,60,.6);display:flex;align-items:center;justify-content:center;font-size:32px}
#dlg{position:fixed;left:10px;right:10px;z-index:4;display:none;gap:12px;align-items:center;background:rgba(6,8,7,.94);border:1px solid #5a2a2a;border-radius:8px;padding:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px)}
#dlg.bnr{bottom:calc(env(safe-area-inset-bottom,0px) + 190px);pointer-events:none;background:rgba(6,8,7,.85)}
#pt{width:72px;height:72px;border-radius:6px;flex:none}#dn{display:block;color:#f0b040;font-size:15px;margin-bottom:2px}#dt{margin:0;font-size:15px;line-height:1.35;min-height:2.7em}#ov{z-index:10}
#ov.menu{background:none;justify-content:flex-start;overflow:auto;padding:0 20px 28px;gap:12px}
#mc{position:absolute;left:0;top:0;width:100%;height:100%;z-index:-1}
.tt{margin-top:13vh;text-align:center}.tt small{letter-spacing:6px;color:#c01820;font-size:12px}
.tt h1{font-size:clamp(30px,9vw,54px);line-height:1.05;margin:10px 0 0;color:#e8e0d8;text-shadow:0 0 14px #b3141b,0 0 40px #600;animation:fl 4s infinite}
.tt em{color:#d01820;font-style:normal}
@keyframes fl{0%,90%,100%{opacity:1}92%{opacity:.4}94%{opacity:1}96%{opacity:.5}}
.btn{letter-spacing:2px;font-size:18px;padding:14px 32px;color:#f4e8e0;background:linear-gradient(#5a0a10,#2a0508);border:1px solid #b3141b;border-radius:6px;box-shadow:0 0 18px rgba(179,20,27,.45)}
.btn.big{font-size:24px;padding:16px 64px;margin-top:6vh}.btn.ghost{background:none;box-shadow:none;border-color:#555;color:#aaa;font-size:15px;padding:10px 24px}
#ov h2{margin:16px 0 0;color:#e8e0d8;letter-spacing:3px;font-size:22px;text-shadow:0 0 10px #600}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap;justify-content:center}.row span{width:78px;text-align:right;font-size:14px;color:#ccc}
button.sw{padding:0;width:30px;height:30px;border-radius:50%;border:2px solid #333;box-shadow:none}button.sw.on{border-color:#fff;box-shadow:0 0 8px #fff}
button.tg{padding:6px 16px;font-size:14px;background:#1a1f1c;border:1px solid #444;border-radius:5px;box-shadow:none}button.tg.on{border-color:#fff;background:#3a1014}
#pv{background:radial-gradient(#1c2a20,#070c09);border:1px solid #3a4a3a;border-radius:8px;cursor:pointer}
#nm{font:inherit;font-size:18px;text-align:center;width:190px;padding:8px;background:#0b110d;color:#fff;border:1px solid #555;border-radius:5px}
.modes{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:8px}
#bg{position:fixed;right:112px;bottom:calc(env(safe-area-inset-bottom,0px) + 36px);width:78px;height:78px;border-radius:50%;background:rgba(255,220,120,.18);border:2px solid rgba(255,220,120,.6);display:none;align-items:center;justify-content:center}
